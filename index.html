<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartShip AI — Shipping Document Verification</title>
<meta name="theme-color" content="#0B1A2B">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M5 17l-1-5h16l-1 5M12 12V4M12 4l5 2M12 4L7 6"/></svg></div>
      <div><b>SmartShip AI</b><span>Shipping document AI</span></div>
    </div>
    <div class="navsec">Operations</div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot">
      <span class="live-tag" id="liveTag"><i class="dot"></i>Connecting…</span>
      <div style="margin-top:9px" id="pollFoot">Polling Gmail…</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="iconbtn menubtn" data-action="toggle-nav" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="q" type="text" placeholder="Search shipments, documents, senders…" autocomplete="off">
      </div>
      <div class="tb-actions">
        <button class="iconbtn" data-action="theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
        <button class="iconbtn" data-action="check-now" aria-label="Check Gmail now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v6h-6"/></svg></button>
        <button class="iconbtn" data-action="notif" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 0 1-3.4 0"/></svg><i class="badge-n hidden" id="notifcount">0</i></button>
        <div class="who"><div class="av">OP</div><div class="whotext"><b>Operations desk</b><span>SmartShip AI console</span></div></div>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="drawer" id="drawer"><div class="veil" data-action="close-drawer"></div><div class="panel" id="drawerPanel"></div></div>
<div class="modal" id="modal"><div class="veil" data-action="close-modal"></div><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/app.js" defer></script>
</body>
</html>
